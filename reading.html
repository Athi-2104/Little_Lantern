<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lantern Login</title>
    <link rel="stylesheet" href="reading_style.css">
    <link href="C:\Users\ATHIRA\OneDrive\Btech CSE\aesthetic.jpg" rel="stylesheet">
</head>
<body>

    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-box">

            <h1>Welcome Back</h1>
            <p>Continue your cozy reading journey ✨</p>

            <form>
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                <input type="password" placeholder="Password" required id="password">
                <span onclick="togglePassword()">👁️</span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember Me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit">Login</button>

                <div class="register">
                    Don't have an account?
                    <a href="#">Register</a>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
